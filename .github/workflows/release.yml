name: Release build

# Builds and tests the release zip when a v* tag is pushed. The GitHub release
# itself is created by the maintainer (gh release create), so it is published
# under their account rather than the github-actions bot.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $name = "tiler-${{ github.ref_name }}-x86_64-windows"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target\release\tiler.exe, README.md, LICENSE $name
          Copy-Item crates\tiler-core\src\default-config.toml "$name\tiler.example.toml"
          Compress-Archive $name "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: tiler-${{ github.ref_name }}-x86_64-windows
          path: tiler-${{ github.ref_name }}-x86_64-windows.zip
