[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Maddox Johnson <maddox.r.johnson@gmail.com>"]
repository = "https://github.com/maddoxrjohnson/tiler"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
regex = "1"
thiserror = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
